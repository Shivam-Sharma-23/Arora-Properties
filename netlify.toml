[build]
  command = "npm --prefix frontend install && npm --prefix frontend run build"
  publish = "frontend/dist"

[dev]
  command = "npm --prefix frontend run dev"
  targetPort = 5173
  publish = "frontend/dist"

# The app is a client-side routed SPA (react-router). Serve index.html for any
# path that isn't a real file so deep links like /properties or /admin work.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
